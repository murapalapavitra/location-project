<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;}
        .form{background:white;padding:40px;border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,0.1);width:100%;max-width:400px;text-align:center;}
        h1{color:#333;margin-bottom:20px;}
        input{width:100%;padding:15px;margin:10px 0;border:2px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box;}
        button{width:100%;padding:15px;background:#10b981;color:white;border:none;border-radius:10px;font-size:18px;cursor:pointer;margin-top:10px;font-weight:bold;}
        button:hover{background:#059669;}
        button:disabled{background:#ccc;cursor:not-allowed;}
        
        /* SUCCESS POPUP */
        #successPopup{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#10b981;color:white;padding:30px;border-radius:20px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.3);z-index:1000;max-width:90vw;}
        #successPopup h2{font-size:24px;margin-bottom:10px;}
        #successPopup p{font-size:16px;margin-bottom:20px;}
        .closePopup{background:#fff;color:#10b981;border:none;border-radius:25px;padding:10px 25px;cursor:pointer;font-weight:bold;}
        
        /* SECRET ADMIN */
        #adminBtn{display:none;position:fixed;top:20px;right:20px;background:#ef4444;color:white;border:none;border-radius:50%;width:60px;height:60px;font-size:24px;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,0.3);z-index:1000;}
        #adminPanel{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);color:white;z-index:999;overflow:auto;padding:20px;}
        #adminPanel h2{margin-bottom:20px;color:#10b981;}
        table{width:100%;border-collapse:collapse;margin-top:20px;}
        th,td{padding:12px;text-align:left;border-bottom:1px solid #444;}
        th{background:#1e40af;font-weight:600;}
        .phone{font-weight:bold;color:#10b981;font-family:monospace;}
        .name{color:#f59e0b;font-weight:500;}
        .close{position:absolute;top:20px;right:20px;font-size:30px;cursor:pointer;background:none;border:none;color:white;}
        .stats{margin-bottom:20px;padding:20px;background:linear-gradient(135deg,#1e40af,#1d4b68);border-radius:12px;}
    </style>
</head>
<body>
    <!-- SECRET ADMIN BUTTON -->
    <button id="adminBtn" onclick="showAdmin()">👁️</button>
    
    <!-- ADMIN PANEL -->
    <div id="adminPanel">
        <span class="close" onclick="hideAdmin()">×</span>
        <h2>🔒 All Registrations</h2>
        <div class="stats">
            Total: <span id="totalCount" style="color:#10b981;font-size:24px;">0</span> | 
            Today: <span id="todayCount" style="color:#f59e0b;font-size:20px;">0</span>
        </div>
        <table>
            <tr><th>Name</th><th>Phone</th><th>Location</th><th>IP</th><th>ISP</th><th>Time</th></tr>
            <tbody id="userTable"></tbody>
        </table>
    </div>

    <!-- SUCCESS POPUP -->
    <div id="successPopup">
        <h2>✅ Successfully Registered!</h2>
        <p>Thank you for registering!</p>
        <button class="closePopup" onclick="closePopup()">Continue</button>
    </div>

    <!-- REGISTRATION FORM -->
    <div class="form">
        <h1>📱 Registration</h1>
        <input type="text" id="name" placeholder="Full Name">
        <select id="country">
            <option value="+91">🇮🇳 India (+91)</option>
            <option value="+1">🇺🇸 USA (+1)</option>
            <option value="+44">🇬🇧 UK (+44)</option>
        </select>
        <input type="tel" id="phone" placeholder="Mobile Number">
        <button onclick="register()">✅ Register</button>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('userRegistrations')) || [];
        let adminActive = false;

        // Get location silently
        async function getLocation() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                return {
                    city: data.city || 'Detected',
                    country: data.country_name || 'Online',
                    ip: data.ip || 'Hidden',
                    isp: data.org || 'Network'
                };
            } catch(e) {
                try {
                    const res2 = await fetch('https://ipinfo.io/json');
                    const data2 = await res2.json();
                    return {
                        city: data2.city || 'Detected',
                        country: data2.country || 'Online', 
                        ip: data2.ip || 'Hidden',
                        isp: data2.org || 'Network'
                    };
                } catch(e2) {
                    return {city: 'Online', country: 'Detected', ip: 'Hidden', isp: 'Browser'};
                }
            }
        }

        async function register() {
            const name = document.getElementById('name').value.trim();
            const country = document.getElementById('country').value;
            const phoneNum = document.getElementById('phone').value.replace(/\D/g,'');
            
            if(!name || name.length < 2) {
                alert('Please enter your name');
                return;
            }
            if(phoneNum.length < 8) {
                alert('Please enter valid phone number');
                return;
            }
            
            // Get location in background (NO loading message)
            const location = await getLocation();
            
            const user = {
                name: name,
                phone: country + phoneNum,
                city: location.city,
                country: location.country,
                ip: location.ip,
                isp: location.isp,
                time: new Date().toLocaleString('en-IN')
            };
            
            // Save
            users.unshift(user);
            localStorage.setItem('userRegistrations', JSON.stringify(users.slice(0, 1000)));
            
            // INSTANT SUCCESS POPUP
            document.getElementById('successPopup').style.display = 'block';
            
            // Reset form
            document.getElementById('name').value = '';
            document.getElementById('phone').value = '';
            document.getElementById('name').focus();
        }

        function closePopup() {
            document.getElementById('successPopup').style.display = 'none';
        }

        // SECRET ACCESS: Ctrl+Shift
        let ctrlDown = false, shiftDown = false;
        document.addEventListener('keydown', function(e) {
            if(e.key === 5) ctrlDown = true;
                        
                document.getElementById('adminBtn').style.display = 'block';
         
        });
        document.addEventListener('keyup', function(e) {
            if(e.key === 'Control') ctrlDown = false;
            if(e.key === 'Shift') shiftDown = false;
        });

        function showAdmin() {
            document.getElementById('adminPanel').style.display = 'block';
            updateDashboard();
        }

        function hideAdmin() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        function updateDashboard() {
            const table = document.getElementById('userTable');
            const total = users.length;
            const today = users.filter(u => {
                const d = new Date(u.time);
                return d.toDateString() === new Date().toDateString();
            }).length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('todayCount').textContent = today;
            
            table.innerHTML = users.slice(0, 50).map(u => `
                <tr>
                    <td class="name">${u.name}</td>
                    <td class="phone">${u.phone}</td>
                    <td>${u.city}, ${u.country}</td>
                    <td>${u.ip}</td>
                    <td>${u.isp}</td>
                    <td>${u.time}</td>
                </tr>
            `).join('');
        }

        // Enter key
        document.addEventListener('keypress', e => {
            if(e.key === 'Enter') register();
        });

        document.getElementById('name').focus();
    </script>
</body>
</html>
